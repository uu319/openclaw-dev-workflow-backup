<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenClaw session routing</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 1080px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .tiny {
    font-size: 11px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 980 640" role="img" aria-label="OpenClaw session routing diagram">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="20" y="30">OpenClaw sessions: one inbound message resolves to exactly one session</text>
    <text class="small" x="20" y="50">Sessions are owned by the Gateway. Session key = agent + origin. Same key = same context.</text>

    <!-- connectors first -->
    <path class="edge" d="M210,102 C238,102 238,230 260,230" marker-end="url(#arrow)" />
    <path class="edge" d="M210,156 C238,156 238,230 260,230" marker-end="url(#arrow)" />
    <path class="edge" d="M210,210 C238,210 238,230 260,230" marker-end="url(#arrow)" />
    <path class="edge" d="M210,264 C238,264 238,230 260,230" marker-end="url(#arrow)" />
    <path class="edge" d="M210,318 C238,318 238,230 260,230" marker-end="url(#arrow)" />
    <path class="edge" d="M210,372 C238,372 238,230 260,230" marker-end="url(#arrow)" />

    <path class="edge" d="M410,230 L460,230" marker-end="url(#arrow)" />

    <path class="edge" d="M630,230 C665,230 675,137 710,137" marker-end="url(#arrow)" />
    <path class="edge" d="M630,230 C665,230 675,207 710,207" marker-end="url(#arrow)" />
    <path class="edge" d="M630,230 C665,230 675,277 710,277" marker-end="url(#arrow)" />
    <path class="edge" d="M630,230 C665,230 675,347 710,347" marker-end="url(#arrow)" />

    <path class="edge" d="M825,396 L825,420" marker-end="url(#arrow)" />
    <path class="edge" d="M335,290 C335,430 380,532 480,532" marker-end="url(#arrow)" />

    <!-- sources -->
    <rect class="node input" x="20" y="80" width="190" height="44" rx="8" />
    <text class="label" x="40" y="107">Discord #channel</text>
    <rect class="node input" x="20" y="134" width="190" height="44" rx="8" />
    <text class="label" x="40" y="161">Discord DM</text>
    <rect class="node input" x="20" y="188" width="190" height="44" rx="8" />
    <text class="label" x="40" y="215">Telegram DM</text>
    <rect class="node input" x="20" y="242" width="190" height="44" rx="8" />
    <text class="label" x="40" y="269">Cron job</text>
    <rect class="node input" x="20" y="296" width="190" height="44" rx="8" />
    <text class="label" x="40" y="323">Heartbeat</text>
    <rect class="node input" x="20" y="350" width="190" height="44" rx="8" />
    <text class="label" x="40" y="377">sessions_spawn</text>

    <!-- hubs -->
    <rect class="node process" x="260" y="170" width="150" height="120" rx="10" />
    <text class="label" x="280" y="205">Bindings</text>
    <text class="tiny" x="280" y="227">most specific wins</text>
    <text class="tiny" x="280" y="245">channel + account</text>
    <text class="tiny" x="280" y="262">+ peer -&gt; agentId</text>

    <rect class="node process" x="460" y="170" width="170" height="120" rx="10" />
    <text class="label" x="480" y="205">Session key</text>
    <text class="tiny" x="480" y="227">dmScope: main</text>
    <text class="tiny" x="480" y="245">groupScope: per-group</text>
    <text class="tiny" x="480" y="262">reset: none by default</text>

    <!-- agent main zone -->
    <rect class="zone" x="690" y="70" width="270" height="326" rx="12" />
    <text class="small" x="706" y="92">Agent: main (workspace + own store)</text>

    <rect class="node storage" x="710" y="110" width="230" height="54" rx="8" />
    <text class="label" x="728" y="133">Main session</text>
    <text class="tiny" x="728" y="151">agent:main:main</text>

    <rect class="node storage" x="710" y="180" width="230" height="54" rx="8" />
    <text class="label" x="728" y="203">Channel session</text>
    <text class="tiny" x="728" y="221">agent:main:discord:channel:&lt;id&gt;</text>

    <rect class="node storage" x="710" y="250" width="230" height="54" rx="8" />
    <text class="label" x="728" y="273">Cron session</text>
    <text class="tiny" x="728" y="291">fresh per run</text>

    <rect class="node storage" x="710" y="320" width="230" height="54" rx="8" />
    <text class="label" x="728" y="343">Subagent session</text>
    <text class="tiny" x="728" y="361">agent:main:subagent:&lt;uuid&gt;</text>

    <rect class="node neutral" x="710" y="420" width="230" height="56" rx="8" />
    <text class="label" x="728" y="444">SQLite transcripts</text>
    <text class="tiny" x="728" y="462">agents/main/agent/*.sqlite</text>

    <!-- second agent zone -->
    <rect class="zone" x="460" y="490" width="500" height="110" rx="12" />
    <text class="small" x="476" y="512">Second bot in the same channel = second agent, no shared context</text>

    <rect class="node external" x="480" y="522" width="220" height="54" rx="8" />
    <text class="label" x="498" y="545">Agent: work</text>
    <text class="tiny" x="498" y="563">agent:work:main</text>

    <rect class="node external" x="720" y="522" width="220" height="54" rx="8" />
    <text class="label" x="738" y="545">Same room, own session</text>
    <text class="tiny" x="738" y="563">agent:work:discord:channel:&lt;id&gt;</text>

    <!-- notes -->
    <text class="small" x="20" y="440">Defaults worth knowing:</text>
    <text class="tiny" x="20" y="462">DMs from every channel collapse into one main session.</text>
    <text class="tiny" x="20" y="480">Groups, rooms, and channels stay isolated per room.</text>
    <text class="tiny" x="20" y="498">Main session watches groups via compact notices, not shared transcript.</text>
    <text class="tiny" x="20" y="516">Sessions never auto-reset; compaction keeps context bounded.</text>
    <text class="tiny" x="20" y="534">/new or /reset rolls a new sessionId under the same key.</text>
    <text class="tiny" x="20" y="552">Multi-user gateway: set dmScope per-channel-peer to stop DM bleed.</text>
  </svg>
</main>
